name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verification helper unit tests
        working-directory: tools/tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 --version
          python3 -m unittest -v test_cargo_handoff test_bounded_test
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: |
          cargo test -p server --test amqp_durable_content_end_to_end --locked --no-run --message-format=json > "$RUNNER_TEMP/durable-content-artifact.json"
          python3 tools/bounded_test.py --timeout 180 --stacks --cargo-artifacts "$RUNNER_TEMP/durable-content-artifact.json" --test-target amqp_durable_content_end_to_end -- --nocapture
          cargo test --workspace --locked -- --skip malformed_and_oversized_content_refuses_and_leaves_the_store_unchanged
      - name: Build
        run: cargo build --workspace --locked
      - name: Validate protobuf
        run: protoc --descriptor_set_out=/tmp/switchyard-admin.pb proto/switchyard/admin/v1/admin.proto
