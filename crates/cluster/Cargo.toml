[package]
name = "cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Local fault fixtures only; never enables server startup or peer trust.
consensus-driver-testkit = []
capacity-conservation-test-support = ["domain/capacity-conservation-test-support"]

[dependencies]
domain.workspace = true
protobuf = "=2.28.0"
raft = { version = "=0.7.0", default-features = false, features = ["protobuf-codec"] }
serde.workspace = true
sha2.workspace = true
slog = "2.8"
storage.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
testkit.workspace = true
fjall.workspace = true
futures-util = { workspace = true, features = ["std", "async-await"] }
serde_json.workspace = true
slog = "2.8"
tempfile.workspace = true
tokio = { workspace = true, features = ["io-std", "process"] }
