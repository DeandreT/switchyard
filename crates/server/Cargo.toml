[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "switchyard"
path = "src/main.rs"

[dependencies]
admin-api.workspace = true
auth.workspace = true
clap.workspace = true
cluster.workspace = true
domain.workspace = true
flume.workspace = true
hyper = { version = "1", features = ["server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
protocol-amqp.workspace = true
rustls.workspace = true
storage.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-rustls.workspace = true
tonic.workspace = true
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
amqp = { workspace = true, features = ["test-client"] }
base64.workspace = true
fjall.workspace = true
hmac.workspace = true
rcgen.workspace = true
ring.workspace = true
roxmltree = "=0.21.1"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_amqp.workspace = true
sha2.workspace = true
tempfile.workspace = true
testkit.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "=1.1.4", features = ["fs", "net", "process"] }
