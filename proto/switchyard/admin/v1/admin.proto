syntax = "proto3";

package switchyard.admin.v1;

service ClusterService {
  rpc GetCluster(GetClusterRequest) returns (Cluster);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
}

service NamespaceService {
  rpc CreateNamespace(CreateNamespaceRequest) returns (Namespace);
  rpc GetNamespace(GetNamespaceRequest) returns (Namespace);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (Operation);
}

service EntityService {
  // Library contract only; no gRPC/HTTP listener or runtime activation exists.
  rpc CreateEntity(CreateEntityRequest) returns (Entity);
  rpc GetEntity(GetEntityRequest) returns (Entity);
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);
  // Reserved contract: deletion is not implemented by the local service.
  rpc DeleteEntity(DeleteEntityRequest) returns (Operation);
}

service BackupService {
  rpc StartBackup(StartBackupRequest) returns (Operation);
  rpc GetOperation(GetOperationRequest) returns (Operation);
}

service AuditService {
  rpc StreamAudit(StreamAuditRequest) returns (stream AuditRecord);
}

message GetClusterRequest {}

message ListNodesRequest {}

message Cluster {
  string cluster_id = 1;
  string version = 2;
  uint32 voters = 3;
}

message Node {
  string node_id = 1;
  string address = 2;
  string availability_zone = 3;
  string state = 4;
}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message CreateNamespaceRequest {
  string name = 1;
  uint64 storage_quota_bytes = 2;
  string key_provider = 3;
  string key_reference = 4;
}

message GetNamespaceRequest {
  string name = 1;
}

message ListNamespacesRequest {
  string page_token = 1;
  uint32 page_size = 2;
}

message DeleteNamespaceRequest {
  string name = 1;
}

message Namespace {
  string name = 1;
  uint64 storage_quota_bytes = 2;
  uint64 used_logical_bytes = 3;
  string key_provider = 4;
}

message ListNamespacesResponse {
  repeated Namespace namespaces = 1;
  string next_page_token = 2;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_QUEUE = 1;
  ENTITY_KIND_TOPIC = 2;
  ENTITY_KIND_SUBSCRIPTION = 3;
}

message CreateEntityRequest {
  string namespace = 1;
  string path = 2;
  EntityKind kind = 3;
  // Presence is wire-compatible at the existing field numbers. Absent supported
  // fields select domain defaults; explicitly encoded zero limits are invalid.
  // Placement/capacity are unavailable: any presence, even empty/zero, refuses.
  optional string placement_group_id = 4;
  optional uint64 max_size_bytes = 5;
  // Absent means unlimited, not zero. Applies to all supported kinds.
  optional uint64 default_ttl_millis = 6;
  // Queue/subscription only.
  optional uint64 lock_duration_millis = 7;
  optional uint32 max_delivery_count = 8;
  // Queue only; presence on a topic/subscription is unsupported, even false.
  optional bool requires_session = 9;
  optional bool requires_duplicate_detection = 10;
  // Zero selects the 600000 ms (10 minute) default. Nonzero values must be
  // between 20000 ms and 604800000 ms, inclusive.
  uint64 duplicate_detection_history_millis = 11;
  // Queue/topic only. Subscription message size is inherited from its parent.
  optional uint64 max_message_bytes = 12;
  // Subscription addresses use these components, with path empty. Queue/topic
  // addresses use path with both components absent. Kind must match the address.
  optional string subscription_topic = 13;
  optional string subscription_name = 14;
  // Usage is unavailable; any presence is unsupported, even zero.
  optional uint64 used_logical_bytes = 15;
  // Duplicate history retains legacy zero-means-default, including on the wire.
  // For topic/subscription, legacy zero is omitted when adapting this request;
  // nonzero duplicate history is unsupported.
}

message GetEntityRequest {
  string namespace = 1;
  string path = 2;
  optional string subscription_topic = 3;
  optional string subscription_name = 4;
}

enum EntitySelection {
  ENTITY_SELECTION_ALL = 0;
  ENTITY_SELECTION_QUEUES = 1;
  ENTITY_SELECTION_TOPICS = 2;
  ENTITY_SELECTION_SUBSCRIPTIONS = 3;
}

message ListEntitiesRequest {
  string namespace = 1;
  // Legacy textual slot retained; no textual token adapter is implemented.
  string page_token = 2 [deprecated = true];
  // Required range 1..100, not zero-means-default.
  uint32 page_size = 3;
  EntitySelection selection = 4;
  // Opaque versioned local cursor; namespace and selection must match.
  optional bytes continuation = 5;
}

message DeleteEntityRequest {
  string namespace = 1;
  string path = 2;
}

message Entity {
  string namespace = 1;
  string path = 2;
  EntityKind kind = 3;
  // Unavailable fields are absent, never fabricated zero/empty values.
  optional string placement_group_id = 4;
  optional uint64 max_size_bytes = 5;
  optional uint64 used_logical_bytes = 6;
  bool requires_duplicate_detection = 7;
  // The entity's concrete effective history window, including the default.
  uint64 duplicate_detection_history_millis = 8;
  // Effective profile: TTL absent means unlimited; receive limits are absent
  // on topics; per-message limit is absent on subscriptions (parent-inherited).
  optional uint64 default_ttl_millis = 9;
  optional uint64 lock_duration_millis = 10;
  optional uint32 max_delivery_count = 11;
  optional uint64 max_message_bytes = 12;
  optional bool requires_session = 13;
  optional string subscription_topic = 14;
  optional string subscription_name = 15;
  // Legacy duplicate fields 7/8 describe queues only; other kinds do not gain
  // duplicate detection. Returned path may exceed the ordinary top-level bound.
}

message ListEntitiesResponse {
  repeated Entity entities = 1;
  string next_page_token = 2 [deprecated = true];
  // Can accompany an empty entity list when internal rows consume the budget.
  optional bytes continuation = 3;
}

message StartBackupRequest {
  string destination = 1;
}

message GetOperationRequest {
  string operation_id = 1;
}

message Operation {
  string operation_id = 1;
  string state = 2;
  string error = 3;
}

message StreamAuditRequest {
  string namespace = 1;
  uint64 after_sequence = 2;
}

message AuditRecord {
  uint64 sequence = 1;
  uint64 unix_millis = 2;
  string actor = 3;
  string namespace = 4;
  string entity = 5;
  string operation = 6;
  string result = 7;
  bytes previous_hash = 8;
  bytes record_hash = 9;
}
