syntax = "proto3";

package switchyard.admin.v1;

service ClusterService {
  rpc GetCluster(GetClusterRequest) returns (Cluster);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
}

service NamespaceService {
  rpc CreateNamespace(CreateNamespaceRequest) returns (Namespace);
  rpc GetNamespace(GetNamespaceRequest) returns (Namespace);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (Operation);
}

service EntityService {
  rpc CreateEntity(CreateEntityRequest) returns (Entity);
  rpc GetEntity(GetEntityRequest) returns (Entity);
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);
  rpc UpdateEntity(UpdateEntityRequest) returns (Entity);
  rpc DeleteEntity(DeleteEntityRequest) returns (Operation);
}

service RuleService {
  rpc CreateRule(CreateRuleRequest) returns (RuleMutationResponse);
  rpc GetRule(GetRuleRequest) returns (Rule);
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc DeleteRule(DeleteRuleRequest) returns (RuleMutationResponse);
  // A separate method prevents older servers from ignoring an action field.
  rpc CreateRuleWithAction(CreateRuleWithActionRequest) returns (RuleMutationResponse);
}

service BackupService {
  rpc StartBackup(StartBackupRequest) returns (Operation);
  rpc GetOperation(GetOperationRequest) returns (Operation);
}

service AuditService {
  rpc StreamAudit(StreamAuditRequest) returns (stream AuditRecord);
}

message GetClusterRequest {}

message ListNodesRequest {}

message Cluster {
  string cluster_id = 1;
  string version = 2;
  uint32 voters = 3;
}

message Node {
  string node_id = 1;
  string address = 2;
  string availability_zone = 3;
  string state = 4;
}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message CreateNamespaceRequest {
  string name = 1;
  uint64 storage_quota_bytes = 2;
  string key_provider = 3;
  string key_reference = 4;
}

message GetNamespaceRequest {
  string name = 1;
}

message ListNamespacesRequest {
  string page_token = 1;
  uint32 page_size = 2;
}

message DeleteNamespaceRequest {
  string name = 1;
}

message Namespace {
  string name = 1;
  uint64 storage_quota_bytes = 2;
  uint64 used_logical_bytes = 3;
  string key_provider = 4;
}

message ListNamespacesResponse {
  repeated Namespace namespaces = 1;
  string next_page_token = 2;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_QUEUE = 1;
  ENTITY_KIND_TOPIC = 2;
  ENTITY_KIND_SUBSCRIPTION = 3;
}

message CreateEntityRequest {
  string namespace = 1;
  string path = 2;
  EntityKind kind = 3;
  string placement_group_id = 4;
  // Entity storage capacity, not an individual message size limit.
  uint64 max_size_bytes = 5;
  uint64 default_ttl_millis = 6;
  uint64 lock_duration_millis = 7;
  uint32 max_delivery_count = 8;
  bool requires_session = 9;
  QueueConfiguration queue_config = 10;
  TopicConfiguration topic_config = 11;
  SubscriptionConfiguration subscription_config = 12;
}

message UnlimitedTimeToLive {}

// Presence distinguishes an omitted setting from a requested false/zero value.
// In updates an absent TTL is unchanged; unlimited is an explicit reset.
message QueueConfiguration {
  optional uint64 lock_duration_millis = 1;
  optional uint32 max_delivery_count = 2;
  oneof default_time_to_live {
    uint64 default_ttl_millis = 3;
    UnlimitedTimeToLive default_ttl_unlimited = 9;
  }
  // Per-message limit, independent of entity storage capacity.
  optional uint64 max_message_bytes = 4;
  optional bool requires_session = 5;
  optional bool requires_duplicate_detection = 6;
  optional uint64 duplicate_detection_history_time_window_millis = 7;
  optional bool dead_lettering_on_message_expiration = 8;
}

message TopicConfiguration {
  oneof default_time_to_live {
    uint64 default_ttl_millis = 1;
    UnlimitedTimeToLive default_ttl_unlimited = 5;
  }
  optional uint64 max_message_bytes = 2;
  optional bool requires_duplicate_detection = 3;
  optional uint64 duplicate_detection_history_time_window_millis = 4;
}

message SubscriptionConfiguration {
  optional uint64 lock_duration_millis = 1;
  optional uint32 max_delivery_count = 2;
  oneof default_time_to_live {
    uint64 default_ttl_millis = 3;
    UnlimitedTimeToLive default_ttl_unlimited = 7;
  }
  optional uint64 max_message_bytes = 4;
  optional bool requires_session = 5;
  optional bool dead_lettering_on_message_expiration = 6;
  optional bool dead_lettering_on_filter_evaluation_exceptions = 8;
}

message UpdateEntityRequest {
  string namespace = 1;
  string path = 2;
  QueueConfiguration queue_config = 3;
  TopicConfiguration topic_config = 4;
  SubscriptionConfiguration subscription_config = 5;
}

message GetEntityRequest {
  string namespace = 1;
  string path = 2;
}

message ListEntitiesRequest {
  string namespace = 1;
  string page_token = 2;
  uint32 page_size = 3;
  // Unspecified preserves the original queue-only listing.
  EntityKind kind = 4;
  // Required only for a subscription listing.
  string parent_topic = 5;
}

message DeleteEntityRequest {
  string namespace = 1;
  string path = 2;
  // Unspecified resolves the entity kind atomically in the broker owner.
  EntityKind kind = 3;
}

message Entity {
  string namespace = 1;
  string path = 2;
  EntityKind kind = 3;
  string placement_group_id = 4;
  // Absent while entity capacity and logical usage accounting are unsupported.
  optional uint64 max_size_bytes = 5;
  optional uint64 used_logical_bytes = 6;
  QueueConfiguration queue_config = 7;
  TopicConfiguration topic_config = 8;
  SubscriptionConfiguration subscription_config = 9;
}

message ListEntitiesResponse {
  repeated Entity entities = 1;
  // Opaque continuation. An empty entity page can still have a continuation;
  // listing is exhausted only when this token is empty.
  string next_page_token = 2;
}

// Subscription paths use the same canonical structure as entity administration.
// Rule mutations are synchronous, create-only or delete-only operations.
message CreateRuleRequest {
  string namespace = 1;
  string subscription_path = 2;
  string name = 3;
  RuleFilter filter = 4;
}

message CreateRuleWithActionRequest {
  string namespace = 1;
  string subscription_path = 2;
  string name = 3;
  RuleFilter filter = 4;
  // Required by the server; omission does not select action-free creation.
  SqlRuleAction action = 5;
}

message GetRuleRequest {
  string namespace = 1;
  string subscription_path = 2;
  string name = 3;
  // False refuses an action-bearing rule instead of hiding its action.
  bool include_actions = 4;
}

message ListRulesRequest {
  string namespace = 1;
  string subscription_path = 2;
  // False refuses the complete response when any member has an action.
  bool include_actions = 3;
}

message DeleteRuleRequest {
  string namespace = 1;
  string subscription_path = 2;
  string name = 3;
}

message RuleMutationResponse {}

message Rule {
  string namespace = 1;
  string subscription_path = 2;
  string name = 3;
  RuleFilter filter = 4;
  uint64 created_at_unix_millis = 5;
  SqlRuleAction action = 6;
}

// The complete bounded rule set; there is no implicit default or continuation.
message ListRulesResponse {
  repeated Rule rules = 1;
}

message TrueRuleFilter {}
message FalseRuleFilter {}

message RuleFilter {
  oneof filter {
    TrueRuleFilter true_filter = 1;
    FalseRuleFilter false_filter = 2;
    CorrelationRuleFilter correlation_filter = 3;
    SqlRuleFilter sql_filter = 4;
  }
}

message SqlRuleFilter {
  string expression = 1;
  // Omitted requests select the current version; responses always include it.
  optional uint32 semantic_version = 2;
}

message SqlRuleAction {
  string expression = 1;
  // Omitted requests select the current version; responses always include it.
  optional uint32 semantic_version = 2;
}

message CorrelationRuleFilter {
  optional string correlation_id = 1;
  optional string message_id = 2;
  optional string to = 3;
  optional string reply_to = 4;
  optional string subject = 5;
  optional string session_id = 6;
  optional string reply_to_session_id = 7;
  optional string content_type = 8;
  // Repeated entries preserve duplicate names so they can be refused.
  repeated CorrelationProperty properties = 9;
}

message CorrelationProperty {
  string name = 1;
  RuleScalarValue value = 2;
}

message RuleNullValue {}

// Scalar constructors and integer widths are distinct, with no coercion.
// Floating-point values retain their original IEEE-754 bits.
message RuleScalarValue {
  oneof value {
    RuleNullValue null_value = 1;
    bool bool_value = 2;
    uint32 ubyte_value = 3;
    uint32 ushort_value = 4;
    uint32 uint_value = 5;
    uint64 ulong_value = 6;
    sint32 byte_value = 7;
    sint32 short_value = 8;
    sint32 int_value = 9;
    sint64 long_value = 10;
    fixed32 float_bits = 11;
    fixed64 double_bits = 12;
    bytes decimal32_bytes = 13;
    bytes decimal64_bytes = 14;
    bytes decimal128_bytes = 15;
    uint32 char_codepoint = 16;
    sint64 timestamp_millis = 17;
    bytes uuid_bytes = 18;
    bytes binary_value = 19;
    string string_value = 20;
    string symbol_value = 21;
  }
}

message StartBackupRequest {
  string destination = 1;
}

message GetOperationRequest {
  string operation_id = 1;
}

message Operation {
  string operation_id = 1;
  string state = 2;
  string error = 3;
}

message StreamAuditRequest {
  string namespace = 1;
  uint64 after_sequence = 2;
}

message AuditRecord {
  uint64 sequence = 1;
  uint64 unix_millis = 2;
  string actor = 3;
  string namespace = 4;
  string entity = 5;
  string operation = 6;
  string result = 7;
  bytes previous_hash = 8;
  bytes record_hash = 9;
}
