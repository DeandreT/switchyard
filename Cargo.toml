[workspace]
resolver = "3"
members = [
    "crates/admin-api",
    "crates/amqp",
    "crates/auth",
    "crates/cluster",
    "crates/conformance",
    "crates/domain",
    "crates/protocol-amqp",
    "crates/server",
    "crates/storage",
    "crates/switchyardctl",
    "crates/testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/DeandreT/switchyard"

[workspace.dependencies]
admin-api = { path = "crates/admin-api" }
amqp = { path = "crates/amqp" }
auth = { path = "crates/auth" }
cluster = { path = "crates/cluster" }
domain = { path = "crates/domain" }
protocol-amqp = { path = "crates/protocol-amqp" }
server = { path = "crates/server" }
storage = { path = "crates/storage" }
testkit = { path = "crates/testkit" }

base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
fjall = "3.1.8"
flume = "0.12"
hmac = "0.12"
percent-encoding = "2.3"
postcard = { version = "1.1", features = ["use-std"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_amqp = "0.14.1"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
