[workspace]
resolver = "3"
members = [
    "crates/admin-api",
    "crates/amqp",
    "crates/auth",
    "crates/cluster",
    "crates/conformance",
    "crates/domain",
    "crates/protocol-amqp",
    "crates/server",
    "crates/storage",
    "crates/switchyardctl",
    "crates/testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/DeandreT/switchyard"

[workspace.dependencies]
admin-api = { path = "crates/admin-api" }
amqp = { path = "crates/amqp" }
auth = { path = "crates/auth" }
cluster = { path = "crates/cluster" }
domain = { path = "crates/domain" }
protocol-amqp = { path = "crates/protocol-amqp" }
server = { path = "crates/server" }
storage = { path = "crates/storage" }
testkit = { path = "crates/testkit" }

base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
fjall = "3.1.8"
flume = "0.12"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hmac = "0.12"
http-body-util = { version = "=0.1.5", default-features = false }
hyper = { version = "=1.11.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
log = "0.4"
openraft = { version = "=0.9.25", default-features = false, features = ["serde", "storage-v2"] }
percent-encoding = "2.3"
postcard = { version = "1.1", features = ["use-std"] }
prost = "0.14.4"
prost-types = "0.14.4"
quick-xml = { version = "=0.42.0", default-features = false }
rcgen = "0.13"
regex = "=1.13.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_amqp = "0.14.1"
sha2 = "0.10"
sqlparser = { version = "=0.63.0", default-features = false, features = ["std"] }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
tonic = { version = "0.14.6", default-features = false, features = ["router", "transport", "codegen", "tls-ring"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
